<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language AR Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- AR Scene Container using your compiled multi-target targets.mind file -->
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload all 4 language videos -->
        <video id="video-japanese" src="JapaneseAR.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
        <video id="video-spanish" src="SpanishAR.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
        <video id="video-arab" src="ArabAR.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
        <video id="video-chinese" src="ChineseAR.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: Japanese (Landscape Quarter-A4) -->
      <a-entity class="ar-target" data-video="video-japanese" mindar-image-target="targetIndex: 0">
        <a-plane src="#video-japanese" position="0 0 0" width="0.7" height="0.5"></a-plane>
      </a-entity>

      <!-- Target 1: Spanish -->
      <a-entity class="ar-target" data-video="video-spanish" mindar-image-target="targetIndex: 1">
        <a-plane src="#video-spanish" position="0 0 0" width="0.7" height="0.5"></a-plane>
      </a-entity>

      <!-- Target 2: Arab -->
      <a-entity class="ar-target" data-video="video-arab" mindar-image-target="targetIndex: 2">
        <a-plane src="#video-arab" position="0 0 0" width="0.7" height="0.5"></a-plane>
      </a-entity>

      <!-- Target 3: Chinese -->
      <a-entity class="ar-target" data-video="video-chinese" mindar-image-target="targetIndex: 3">
        <a-plane src="#video-chinese" position="0 0 0" width="0.7" height="0.5"></a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const targets = document.querySelectorAll('.ar-target');

        targets.forEach((target) => {
          const videoId = target.getAttribute('data-video');
          const video = document.querySelector(`#${videoId}`);

          // Play the corresponding video when its target image is scanned
          target.addEventListener('targetFound', () => {
            console.log(`Target found for: ${videoId}`);
            video.play();
          });

          // Pause and reset the video when looking away from the image
          target.addEventListener('targetLost', () => {
            console.log(`Target lost for: ${videoId}`);
            video.pause();
            video.currentTime = 0;
          });
        });
      });
    </script>
  </body>
</html>
