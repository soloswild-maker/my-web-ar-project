<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web AR Video Tracking</title>
    <!-- Include A-Frame and MindAR A-Frame libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload your MP4 video (replace 'your-video.mp4' with video you want to use) -->
        <video 
          id="ar-video" 
          src="Line Town.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous" 
          playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target entity mapped to index 0 -->
      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        <!-- A-Plane mapped with the video. 
             Change width and height to match your video/target aspect ratio -->
        <a-plane 
          src="#ar-video" 
          position="0 0 0" 
          height="1" 
          width="1.77" 
          rotation="0 0 0">
        </a-plane>
      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const targetEntity = document.querySelector('#ar-target');
        const videoElement = document.querySelector('#ar-video');

        // Play video automatically when target image is scanned
        targetEntity.addEventListener('targetFound', () => {
          videoElement.play();
        });

        // Pause video when target image leaves the camera view
        targetEntity.addEventListener('targetLost', () => {
          videoElement.pause();
        });
      });
    </script>
  </body>
</html>
