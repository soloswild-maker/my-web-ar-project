<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebAR Experience</title>
    <!-- Import the Google Model Viewer component -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; width: 100vw; height: 100vh; background-color: #111; }
      model-viewer { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Replace 'model.glb' with your actual file name -->
    <model-viewer src="model.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="1">
    </model-viewer>
  </body>
</html>
