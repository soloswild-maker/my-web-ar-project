<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebAR Experience</title>
    <!-- Import Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      body { margin: 0; width: 100vw; height: 100vh; background-color: #111; font-family: sans-serif; }
      model-viewer { width: 100%; height: 100%; }
      
      /* Style for the custom AR button */
      #ar-button {
        background: #ffffff;
        color: #222;
        border-radius: 4px;
        border: none;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 12px 20px;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <model-viewer 
      src="model.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1">
      
      <!-- Explicit AR button slot -->
      <button id="ar-button" slot="ar-button">
        📦 View in Your Space (AR)
      </button>
      
    </model-viewer>
  </body>
</html>
